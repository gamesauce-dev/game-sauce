name: Release

# Pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) builds the downloads and publishes a GitHub Release:
#   game-sauce-vX.Y.Z-windows-x64.zip     game-sauce-vX.Y.Z-macos-arm64.tar.gz (Apple Silicon)
#   game-sauce-vX.Y.Z-linux-x64.tar.gz    game-sauce-vX.Y.Z-linux-arm64.tar.gz (Raspberry Pi 4/5, ARM servers)
# plus SHA256SUMS. Each of those is a portable bundle (the program, its modules and its own Node.js): unpack and start, nothing to install.
# The desktop app installers (game-sauce in its own window: Windows .exe, Apple Silicon .dmg, Linux .deb / .rpm / .AppImage) are attached to the same release.
# The Docker image is published by docker.yml on the same tag.
# "Run workflow" (manual) builds the bundles and keeps them as workflow artifacts without publishing a release: a safe dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, label: windows-x64 }
          - { runner: macos-latest, label: macos-arm64 }       # Apple Silicon
          - { runner: ubuntu-latest, label: linux-x64 }
          - { runner: ubuntu-24.04-arm, label: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24      # the Node bundled into the download is this major, so the modules are installed with the same one
      - name: Version from the tag (or package.json for a manual run)
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./package.json').version")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the bundle and start it once to prove it works
        run: node scripts/build-bundle.mjs --smoke --version "${{ steps.ver.outputs.version }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # The desktop app: game-sauce in its own window (Tauri), with the server built in or pointed at another one. Installers: Windows (.exe), Apple Silicon (.dmg), Linux (.deb, .AppImage).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, label: windows-x64, bundles: nsis }
          - { runner: macos-latest, label: macos-arm64, bundles: dmg }
          - { runner: ubuntu-22.04, label: linux-x64, bundles: deb, extra: appimage }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux - the web view and packaging libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Tauri downloads its packaging tools (NSIS on Windows, linuxdeploy on Linux) from GitHub while bundling, and GitHub's servers sometimes answer 502 or 504.
      # Keeping them from one run to the next means a good download is only needed once.
      - name: Keep Tauri's packaging tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ runner.os }}-1
      - name: Keep Tauri's packaging tools (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-1
      - name: Build the installer
        working-directory: desktop
        shell: bash
        env:
          # Optional: an Apple Developer ID certificate (a paid Apple developer account). With these secrets set, the Mac app is signed and notarised, and macOS opens it
          # with no warning. Without them it is signed "ad hoc" (see tauri.conf.json): macOS asks for one extra step the first time (see the README).
          GS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          GS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          GS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GS_APPLE_ID: ${{ secrets.APPLE_ID }}
          GS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          GS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          npm run prepare-server
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$GS_APPLE_CERTIFICATE" ] && [ -n "$GS_APPLE_SIGNING_IDENTITY" ]; then
              export APPLE_CERTIFICATE="$GS_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$GS_APPLE_CERTIFICATE_PASSWORD" APPLE_SIGNING_IDENTITY="$GS_APPLE_SIGNING_IDENTITY"
              # Tauri signs the app's own program, but Apple's notary also wants every native file inside it signed with the same certificate and a secure timestamp
              # (better-sqlite3's .node file is one), so sign those first, with a temporary keychain that holds the certificate.
              KC="$RUNNER_TEMP/gs-sign.keychain-db"; KCPW="$(uuidgen)"
              printf '%s' "$GS_APPLE_CERTIFICATE" | tr -d '[:space:]' | base64 -D > "$RUNNER_TEMP/gs-cert.p12"; echo "Mac: certificate file is $(wc -c < "$RUNNER_TEMP/gs-cert.p12") bytes"
              security create-keychain -p "$KCPW" "$KC"
              security set-keychain-settings -lut 21600 "$KC"
              security unlock-keychain -p "$KCPW" "$KC"
              if ! security import "$RUNNER_TEMP/gs-cert.p12" -k "$KC" -P "$GS_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign; then
                # A certificate file made with OpenSSL 3 uses a newer seal that the Mac's own tool can fail to read: write it again in the older form and import that.
                echo "Mac: the certificate did not import as it is, converting it to the older file format"
                SSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"; [ -x "$SSL" ] || SSL=openssl
                "$SSL" pkcs12 -in "$RUNNER_TEMP/gs-cert.p12" -nodes -passin env:GS_APPLE_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/gs-cert.pem"
                "$SSL" pkcs12 -export -in "$RUNNER_TEMP/gs-cert.pem" -out "$RUNNER_TEMP/gs-cert-old.p12" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -passout pass:gs-temp-pass
                security import "$RUNNER_TEMP/gs-cert-old.p12" -k "$KC" -P gs-temp-pass -T /usr/bin/codesign
                rm -f "$RUNNER_TEMP/gs-cert.pem" "$RUNNER_TEMP/gs-cert-old.p12"
              fi
              security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
              security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
              rm -f "$RUNNER_TEMP/gs-cert.p12"
              find server-stage/server/app -name '*.node' | while read -r f; do
                if file "$f" | grep -q Mach-O; then echo "Mac: signing $f"; codesign --force --timestamp --options runtime --sign "$GS_APPLE_SIGNING_IDENTITY" "$f"; fi
              done
              if [ -n "$GS_APPLE_ID" ] && [ -n "$GS_APPLE_PASSWORD" ] && [ -n "$GS_APPLE_TEAM_ID" ]; then
                export APPLE_ID="$GS_APPLE_ID" APPLE_PASSWORD="$GS_APPLE_PASSWORD" APPLE_TEAM_ID="$GS_APPLE_TEAM_ID"
                echo "Mac: signing with the Developer ID and notarising"
              else
                echo "Mac: signing with the Developer ID (no notarisation: the Apple ID secrets are not set)"
              fi
            else
              echo "Mac: no Apple certificate, signing ad hoc"
            fi
          fi
          # When a download still fails, wait and try again: up to five attempts, a little longer each time.
          for i in 1 2 3 4 5; do
            npx tauri build --bundles ${{ matrix.bundles }} && exit 0
            echo "The build failed (attempt $i of 5), trying again in $((45 * i)) seconds..."; sleep $((45 * i))
          done
          exit 1
      # The Mac installer: check the signature held (a seal that does not hold is what macOS calls "damaged": stop here rather than ship it), look at what Gatekeeper
      # says about the copy inside the disk image, and name it like the portable Mac download.
      - name: Mac - check the signature and name the installer
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -e
          v="$(node -p "require('../package.json').version")"
          dir=src-tauri/target/release/bundle/dmg
          dmg="$(ls $dir/*.dmg | head -1)"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/gs-dmg "$dmg"
          app=/tmp/gs-dmg/game-sauce.app
          echo "== the signature"; codesign -dv --verbose=2 "$app" 2>&1 | head -20
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "== what Gatekeeper says (rejected is expected without a Developer ID; this is for the log)"
          cp -R "$app" /tmp/gs-check.app
          xattr -w com.apple.quarantine "0083;$(date +%s);Safari;" /tmp/gs-check.app
          spctl --assess --type execute --verbose=4 /tmp/gs-check.app 2>&1 || true
          hdiutil detach /tmp/gs-dmg
          mv "$dmg" "$dir/game-sauce-v${v}-macos-arm64.dmg"
          ls -la $dir
      # The AppImage needs a packaging tool downloaded from GitHub, which is the part that fails when GitHub is having a bad moment. It is tried on its own and may fail
      # without stopping the release: the .deb (and the portable bundle) are already built.
      - name: Linux AppImage (optional)
        if: matrix.extra
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # linuxdeploy is itself an AppImage, and the runners have no FUSE to run it the normal way
          NO_STRIP: true
        working-directory: desktop
        shell: bash
        run: |
          # --verbose makes Tauri show what linuxdeploy (the tool that builds the AppImage) said, which it hides otherwise. Two tries: when it fails here it is not a download problem.
          set -o pipefail
          for i in 1 2; do
            npx tauri build --bundles ${{ matrix.extra }} --verbose 2>&1 | tail -n 120 && exit 0
            echo "The ${{ matrix.extra }} build failed (attempt $i of 2)."; sleep 20
          done
          exit 1
      # The .rpm is for Fedora-based systems (Bazzite, Nobara, Fedora): it uses the computer's own web view, which the AppImage's bundled one can disagree with. Optional, like the AppImage.
      - name: Linux RPM (optional)
        if: matrix.extra
        continue-on-error: true
        working-directory: desktop
        shell: bash
        run: npx tauri build --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [bundle, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v. Bump package.json, then tag again."; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*'
          path: dist
          merge-multiple: true
      - name: One checksum file for everything
        working-directory: dist
        run: |
          # Some artifacts keep a folder (the Linux installers sit in deb/ and appimage/): put every file at the top, so the checksums and the release see plain files.
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          rm -f *.sha256
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -la
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          note="**Mac:** the .dmg installer is signed and notarised by Apple, so it opens with only the usual \"downloaded from the internet\" question. The portable .tar.gz is not: if macOS refuses to open **Start game-sauce.command**, run \`xattr -dr com.apple.quarantine\` on the unpacked folder once. Details in the README."
          gh release create "${GITHUB_REF_NAME}" dist/* --title "game-sauce ${GITHUB_REF_NAME}" --notes "$note" --generate-notes --notes-start-tag "$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)" \
            || gh release create "${GITHUB_REF_NAME}" dist/* --title "game-sauce ${GITHUB_REF_NAME}" --notes "$note" --generate-notes
