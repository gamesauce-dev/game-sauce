name: Release

# Pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) builds the downloads and publishes a GitHub Release:
#   game-sauce-vX.Y.Z-windows-x64.zip     game-sauce-vX.Y.Z-macos-arm64.tar.gz (Apple Silicon)
#   game-sauce-vX.Y.Z-linux-x64.tar.gz    game-sauce-vX.Y.Z-linux-arm64.tar.gz (Raspberry Pi 4/5, ARM servers)
# plus SHA256SUMS. Each is a portable bundle (the program, its modules and its own Node.js): unpack and start, nothing to install.
# The Docker image is published by docker.yml on the same tag.
# "Run workflow" (manual) builds the bundles and keeps them as workflow artifacts without publishing a release: a safe dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, label: windows-x64 }
          - { runner: macos-latest, label: macos-arm64 }       # Apple Silicon
          - { runner: ubuntu-latest, label: linux-x64 }
          - { runner: ubuntu-24.04-arm, label: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24      # the Node bundled into the download is this major, so the modules are installed with the same one
      - name: Version from the tag (or package.json for a manual run)
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./package.json').version")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the bundle and start it once to prove it works
        run: node scripts/build-bundle.mjs --smoke --version "${{ steps.ver.outputs.version }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v. Bump package.json, then tag again."; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: One checksum file for everything
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS && rm *.sha256 && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "game-sauce ${GITHUB_REF_NAME}" --generate-notes --notes-start-tag "$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)" \
            || gh release create "${GITHUB_REF_NAME}" dist/* --title "game-sauce ${GITHUB_REF_NAME}" --generate-notes
