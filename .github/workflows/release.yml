name: Release

# Pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) builds the downloads and publishes a GitHub Release:
#   game-sauce-vX.Y.Z-windows-x64.zip     game-sauce-vX.Y.Z-macos-arm64.tar.gz (Apple Silicon)
#   game-sauce-vX.Y.Z-linux-x64.tar.gz    game-sauce-vX.Y.Z-linux-arm64.tar.gz (Raspberry Pi 4/5, ARM servers)
# plus SHA256SUMS. Each of those is a portable bundle (the program, its modules and its own Node.js): unpack and start, nothing to install.
# The desktop app installers (game-sauce in its own window: Windows .exe, Apple Silicon .dmg, Linux .deb / .AppImage) are attached to the same release.
# The Docker image is published by docker.yml on the same tag.
# "Run workflow" (manual) builds the bundles and keeps them as workflow artifacts without publishing a release: a safe dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, label: windows-x64 }
          - { runner: macos-latest, label: macos-arm64 }       # Apple Silicon
          - { runner: ubuntu-latest, label: linux-x64 }
          - { runner: ubuntu-24.04-arm, label: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24      # the Node bundled into the download is this major, so the modules are installed with the same one
      - name: Version from the tag (or package.json for a manual run)
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./package.json').version")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the bundle and start it once to prove it works
        run: node scripts/build-bundle.mjs --smoke --version "${{ steps.ver.outputs.version }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # The desktop app: game-sauce in its own window (Tauri), with the server built in or pointed at another one. Installers: Windows (.exe), Apple Silicon (.dmg), Linux (.deb, .AppImage).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, label: windows-x64, bundles: nsis }
          - { runner: macos-latest, label: macos-arm64, bundles: dmg }
          - { runner: ubuntu-22.04, label: linux-x64, bundles: deb, extra: appimage }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux - the web view and packaging libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Tauri downloads its packaging tools (NSIS on Windows, linuxdeploy on Linux) from GitHub while bundling, and GitHub's servers sometimes answer 502 or 504.
      # Keeping them from one run to the next means a good download is only needed once.
      - name: Keep Tauri's packaging tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ runner.os }}-1
      - name: Keep Tauri's packaging tools (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-1
      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm run prepare-server
          # When a download still fails, wait and try again: up to five attempts, a little longer each time.
          for i in 1 2 3 4 5; do
            npx tauri build --bundles ${{ matrix.bundles }} && exit 0
            echo "The build failed (attempt $i of 5), trying again in $((45 * i)) seconds..."; sleep $((45 * i))
          done
          exit 1
      # The AppImage needs a packaging tool downloaded from GitHub, which is the part that fails when GitHub is having a bad moment. It is tried on its own and may fail
      # without stopping the release: the .deb (and the portable bundle) are already built.
      - name: Linux AppImage (optional)
        if: matrix.extra
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # linuxdeploy is itself an AppImage, and the runners have no FUSE to run it the normal way
          NO_STRIP: true
        working-directory: desktop
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npx tauri build --bundles ${{ matrix.extra }} && exit 0
            echo "The ${{ matrix.extra }} build failed (attempt $i of 5), trying again in $((45 * i)) seconds..."; sleep $((45 * i))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [bundle, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v. Bump package.json, then tag again."; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*'
          path: dist
          merge-multiple: true
      - name: One checksum file for everything
        working-directory: dist
        run: rm -f *.sha256 && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "game-sauce ${GITHUB_REF_NAME}" --generate-notes --notes-start-tag "$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)" \
            || gh release create "${GITHUB_REF_NAME}" dist/* --title "game-sauce ${GITHUB_REF_NAME}" --generate-notes
