<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Play</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #emu { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9a9ab0; font: 14px system-ui, sans-serif; z-index: 4; pointer-events: none; }
  #picker { position: fixed; inset: 0; background: #0b0b12; color: #e8e8f0; font: 14px system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 20px; overflow: auto; z-index: 5; }
  #picker h2 { margin: 6px 0 4px; font-size: 18px; }
  #picker p { margin: 0 0 14px; color: #9a9ab0; font-size: 12.5px; }
  .slot { display: flex; align-items: center; gap: 12px; width: min(520px, 100%); margin: 0 0 8px; padding: 8px;
          background: #161622; border: 1px solid #2a2a3c; border-radius: 8px; }
  .slot img, .slot .noshot { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; background: #000; flex: 0 0 96px; }
  .slot .meta { flex: 1; font-size: 12.5px; color: #9a9ab0; }
  .slot .warn { color: #ffb347; font-size: 11.5px; margin-top: 2px; }
  .slot .meta b { display: block; color: #e8e8f0; font-size: 13.5px; }
  button { font: inherit; cursor: pointer; border: 1px solid #3a3a52; background: #22223a; color: #e8e8f0; border-radius: 6px; padding: 7px 12px; }
  button:hover { border-color: #ff3d68; }
  button.primary { background: #ff3d68; border-color: #ff3d68; color: #fff; }
  #msg { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #161622; border: 1px solid #2a2a3c;
         color: #e8e8f0; padding: 6px 12px; border-radius: 6px; font: 12.5px system-ui, sans-serif; z-index: 9; display: none; }
</style>
</head>
<body>
<div id="wait">Loading emulator…</div>
<div id="msg"></div>
<script>
  // The trusted half of the player. It is signed in (every request carries the session cookie, so no token is ever in an address) and it looks
  // after the saves. It loads no outside code. The emulator, which comes from another website, runs in a frame of its own (ejs-frame.html) that is
  // cut off from this page, the session and the server: it is handed this one game, and may only hand back save data for it.
  // Saves are per signed-in user (server scopes by session): states via /api/roms/:id/saves, battery (in-game) saves loaded on start.
  // Anything the frame sends is treated as untrusted: only known messages, only from that frame, and never shown as text.
  const q = new URLSearchParams(location.search);
  const romId = q.get('id');
  const api = '/api/roms/' + encodeURIComponent(romId) + '/saves';
  const core = q.get('core') || '';
  const MAX_SAVE = 32 * 1024 * 1024, MAX_SHOT = 2 * 1024 * 1024;

  function flash(text) {
    const m = document.getElementById('msg');
    m.textContent = text; m.style.display = 'block';
    clearTimeout(flash.t); flash.t = setTimeout(() => { m.style.display = 'none'; }, Math.max(2500, String(text).length * 70));   // a long message stays long enough to read
  }
  const waiting = (text) => { const w = document.getElementById('wait'); w.textContent = text; w.style.display = text ? 'flex' : 'none'; };
  const fetchBytes = async (url) => {
    const r = await fetch(url, { credentials: 'same-origin' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  };
  // The game itself can be large, so the wait says how far it has got.
  async function fetchGame(url) {
    const r = await fetch(url, { credentials: 'same-origin' });
    if (!r.ok) { const why = await r.json().catch(() => null); throw new Error((why && why.error) || 'HTTP ' + r.status); }
    const total = Number(r.headers.get('content-length')) || 0;
    if (!total || !r.body || r.headers.get('content-encoding')) return r.arrayBuffer();   // (compressed on the way, the length is not the file's)
    const all = new Uint8Array(total), reader = r.body.getReader();
    let at = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (at + value.length > total) throw new Error('The game file changed while it was being read');
      all.set(value, at); at += value.length;
      waiting('Loading game… ' + Math.floor((at / total) * 100) + '%');
    }
    if (at !== total) throw new Error('The game did not arrive in full');
    return all.buffer;
  }
  const upload = async (url, method, bytes, extra) => {
    const r = await fetch(url, { method, credentials: 'same-origin', body: bytes,
      headers: { 'Content-Type': 'application/octet-stream' }, ...extra });
    if (!r.ok) {
      // The server's own words when it gives them (a full save space says what to do about it).
      const why = await r.json().catch(() => null);
      throw Object.assign(new Error((why && why.error) || 'HTTP ' + r.status), { code: why && why.code });
    }
    return r.json();
  };
  // Anything stored with a save is written into the page as text, never as markup.
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (s) => new Date(s.replace(' ', 'T') + 'Z').toLocaleString();
  async function listSaves() {
    try { return (await (await fetch(api, { credentials: 'same-origin' })).json()).items || []; }
    catch { return []; }
  }
  // Current EmulatorJS build (CDN 'latest' moves). States are tagged "<system>@<version>"
  // when saved; a different tag on load means the state may not restore. Only a version number is accepted from that answer.
  let ejsVersion = '';
  const versionReady = fetch('https://cdn.emulatorjs.org/latest/data/version.json', { credentials: 'omit', referrerPolicy: 'no-referrer' })
    .then((r) => r.json()).then((j) => { const v = String(j.version || ''); if (/^[\w.-]{1,20}$/.test(v)) ejsVersion = v; }).catch(() => {});
  const tag = () => core + (ejsVersion ? '@' + ejsVersion : '');
  function mismatch(s) {
    const [c, v] = String(s.core || '').split('@');
    if (c && core && c !== core) return 'Saved for a different system core (' + c + ').';
    if (v && ejsVersion && v !== ejsVersion) return 'Saved with EmulatorJS ' + v + '; current is ' + ejsVersion + '. It may fail to load or glitch.';
    if (!v) return 'Saved before version tracking; compatibility unknown.';
    return '';
  }
  const notify = () => { try { parent.postMessage({ type: 'saves-changed', rom: Number(romId) }, location.origin); } catch {} };

  /* ── the emulator's settings (controls, picture options). An isolated frame cannot keep anything, so they are kept here for it:
        only its own keys ("ejs-…"), only text, within a size limit, and never read by this page. ── */
  const STORE = 'gamesauce_ejs_frame', STORE_MAX = 1024 * 1024;
  function readStore() {
    try {
      const kept = localStorage.getItem(STORE);
      if (kept) return JSON.parse(kept) || {};
      // The first time: what the emulator had saved before it was isolated comes along.
      const had = {};
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('ejs-')) had[k] = localStorage.getItem(k); }
      return had;
    } catch { return {}; }
  }
  const store = readStore();
  function keepSetting(key, value) {
    if (typeof key !== 'string' || !key.startsWith('ejs-') || key.length > 300) return;
    if (value !== null && (typeof value !== 'string' || value.length > 64 * 1024)) return;
    delete store[key];
    if (value !== null) store[key] = value;   // written last, so the least recently changed are first to go
    try {
      let text = JSON.stringify(store);
      for (const k of Object.keys(store)) { if (text.length <= STORE_MAX) break; delete store[k]; text = JSON.stringify(store); }
      localStorage.setItem(STORE, text);
    } catch { /* not kept this time */ }
  }

  /* ── picker: choose a state (start-up, or mid-game via Load State) ── */
  let picking = false;
  function pickState(states, { allowNew }) {
    picking = true;
    return new Promise((resolve) => {
      const el = document.createElement('div');
      el.id = 'picker';
      el.innerHTML = '<h2>Your save states</h2><p>Only you can see these. In-game (battery) saves load automatically.</p>';
      const done = (v) => { el.remove(); picking = false; resolve(v); };
      states.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'slot';
        row.innerHTML = (s.has_screenshot ? '<img alt="" src="' + api + '/' + s.id + '/screenshot">' : '<div class="noshot"></div>') +
          '<div class="meta"><b>' + (i === 0 ? 'Latest — ' : '') + fmtDate(s.updated_at) + '</b>' +
          Math.round(s.size_bytes / 1024) + ' KB' + (mismatch(s) ? '<div class="warn">⚠ ' + esc(mismatch(s)) + '</div>' : '') + '</div>';
        const b = document.createElement('button');
        b.textContent = 'Load'; if (i === 0) b.className = 'primary';
        b.onclick = () => {
          if (mismatch(s) && b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Load anyway'; return; }
          done(s);
        };
        row.appendChild(b);
        el.appendChild(row);
      });
      const n = document.createElement('button');
      n.textContent = allowNew ? 'Start new game' : 'Cancel';
      n.style.marginTop = '8px';
      n.onclick = () => done(null);
      el.appendChild(n);
      document.body.appendChild(el);
    });
  }

  /* ── the isolated frame ── */
  let emu = null;
  const toFrame = (message, transfer) => emu.contentWindow.postMessage(message, '*', transfer || []);   // '*': an isolated frame has no address to name
  const focusGame = () => { try { emu.focus(); } catch {} };
  const asBytes = (v, max) => (v instanceof Uint8Array && v.byteLength > 0 && v.byteLength <= max ? v : null);

  // Saves from the frame are taken one at a time and not faster than a person (or the in-game autosave) makes them, so that a faulty or
  // harmful emulator cannot push out this game's older states in a moment.
  let lastState = 0, battery = { next: null, busy: false, last: 0 }, toldFull = false;
  async function keepState(state, screenshot) {
    if (Date.now() - lastState < 2000) return flash('Please wait a moment before saving again');
    lastState = Date.now();
    try {
      const r = await upload(api + '?kind=state&core=' + encodeURIComponent(tag()), 'POST', state);
      if (screenshot) await upload(api + '/' + Number(r.id) + '/screenshot', 'PUT', screenshot).catch(() => {});
      flash('State saved to your account'); notify();
    } catch (e) { flash('Save failed: ' + e.message); }
  }
  // The newest in-game save waiting is the one that counts: an older one still in the queue is replaced by it.
  async function keepBattery(save, byHand) {
    battery.next = { save, byHand: byHand || Boolean(battery.next && battery.next.byHand) };
    if (battery.busy) return;
    battery.busy = true;
    while (battery.next) {
      const wait = battery.last + 5000 - Date.now();
      if (wait > 0) await new Promise((ok) => setTimeout(ok, wait));
      const job = battery.next; battery.next = null; battery.last = Date.now();
      try {
        await upload(api + '?kind=battery&core=' + encodeURIComponent(tag()), 'POST', job.save); toldFull = false; notify();
        if (job.byHand) flash('In-game save stored');
      } catch (e) {
        // The next change tries again. A full save space will not clear itself, so that one is said (once), not left silent.
        if (job.byHand) flash('Save failed: ' + e.message);
        else if (e.code === 'save_space_full' && !toldFull) { toldFull = true; flash('In-game save not kept. ' + e.message); }
      }
    }
    battery.busy = false;
  }
  async function chooseState() {
    if (picking) return;
    const list = (await listSaves()).filter((s) => s.kind === 'state');
    if (!list.length) return flash('No saved states yet');
    const pick = await pickState(list, { allowNew: false });
    focusGame();
    if (!pick) return;
    try { const bytes = await fetchBytes(api + '/' + pick.id + '/file'); toFrame({ type: 'load-state', bytes }, [bytes]); }
    catch (e) { flash('Load failed: ' + e.message); }
  }
  async function sendBattery() {
    const now = (await listSaves()).find((s) => s.kind === 'battery');   // asked each time: every autosave replaces the one before
    if (!now) return flash('No in-game save yet');
    try { const bytes = await fetchBytes(api + '/' + now.id + '/file'); toFrame({ type: 'load-battery', bytes }, [bytes]); }
    catch (e) { flash('Load failed: ' + e.message); }
  }

  let start = null;
  addEventListener('message', (e) => {
    if (!emu || e.source !== emu.contentWindow || e.origin !== 'null') return;   // only the isolated frame is listened to
    const m = e.data && typeof e.data === 'object' ? e.data : {};
    if (m.type === 'ready' && start) {   // handed over once only
      const s = start; start = null;
      toFrame(s, [s.rom, s.state, s.battery].filter(Boolean));
      waiting('');   // the emulator shows its own progress from here
    } else if (m.type === 'started') { waiting(''); focusGame(); }
    else if (m.type === 'storage') keepSetting(m.key, m.value);
    else if (!romId) return;
    else if (m.type === 'state') { const state = asBytes(m.state, MAX_SAVE); if (state) keepState(state, asBytes(m.screenshot, MAX_SHOT)); }
    else if (m.type === 'battery') { const save = asBytes(m.save, MAX_SAVE); if (save) keepBattery(save, m.byHand === true); }
    else if (m.type === 'want-load') chooseState();
    else if (m.type === 'want-battery') sendBattery();
    else if (m.type === 'loaded') flash(m.what === 'battery' ? (m.ok === true ? 'In-game save loaded' : 'Load failed') : (m.ok === true ? 'State loaded' : 'Load failed'));
  });

  async function boot() {
    await Promise.race([versionReady, new Promise((r) => setTimeout(r, 2500))]);
    const all = romId ? await listSaves() : [];
    const states = all.filter((s) => s.kind === 'state');
    const inGame = all.find((s) => s.kind === 'battery');
    let startState = null;
    if (states.length) { waiting(''); startState = await pickState(states, { allowNew: true }); }

    // The game's address is only ever one on this server.
    const from = new URL(q.get('rom') || '', location.origin);
    if (from.origin !== location.origin || !from.pathname.startsWith('/api/roms/')) return waiting('That is not a game on this server.');
    waiting('Loading game…');
    let rom, stateBytes = null, batteryBytes = null;
    try {
      rom = await fetchGame(from.pathname + from.search);
      if (startState) stateBytes = await fetchBytes(api + '/' + startState.id + '/file');
      // The in-game save is restored on start (not when a full state is being loaded: the state contains it).
      else if (inGame) batteryBytes = await fetchBytes(api + '/' + inGame.id + '/file').catch(() => null);
    } catch (e) { return waiting('The game could not be loaded: ' + e.message); }
    waiting('Loading emulator…');
    const name = decodeURIComponent(from.pathname.split('/').pop() || 'game');   // arcade cores go by the file's exact name
    start = { type: 'start', name, rom, core, title: q.get('title') || 'game', state: stateBytes, battery: batteryBytes, saves: Boolean(romId), settings: { ...store } };

    emu = document.createElement('iframe');
    emu.id = 'emu';
    emu.title = 'Emulator';
    emu.setAttribute('sandbox', 'allow-scripts allow-pointer-lock');   // never allow-same-origin: that would undo all of it
    emu.setAttribute('allow', 'gamepad *; fullscreen *; autoplay *; screen-wake-lock *');   // "*": an isolated frame matches no named address
    emu.src = '/ejs-frame.html';
    document.body.appendChild(emu);
    setTimeout(() => waiting(''), 20000);   // the emulator shows its own progress and errors
  }
  boot();
</script>
</body>
</html>
